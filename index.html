<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أزهار طقوش | Takkosh Flower Bristol</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #d9777f;
            --whatsapp-green: #25D366;
            --whatsapp-hover: #1ebd5a;
            --bg-gradient: linear-gradient(135deg, #fff5f5 0%, #f7eff2 100%);
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #777777;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 30px 24px;
            text-align: center;
        }

        /* شعار المتجر */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 4px 15px rgba(217, 119, 127, 0.2);
        }

        .store-name-ar {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2px;
            color: #2c3e50;
        }

        .store-name-en {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 8px;
            direction: ltr;
        }

        .store-bio {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* أزرار الطلب والتواصل */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        /* زر واتساب */
        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--whatsapp-green);
            color: #fff;
            text-decoration: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
        }

        .whatsapp-btn:hover {
            background-color: var(--whatsapp-hover);
            transform: translateY(-2px);
        }

        /* روابط وسائل التواصل الاجتماعي */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .social-icon:hover {
            transform: scale(1.1);
            opacity: 0.9;
        }

        .instagram { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
        .tiktok { background-color: #000000; }
        .facebook { background-color: #1877F2; }

        /* معرض المنتجات */
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: right;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2c3e50;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .product-card {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background-color: #f0f0f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover img {
            transform: scale(1.06);
        }

        .product-tag {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-container">
            <img src="2b0ac39db80a0b62f75956aa92515f10.jpg" alt="شعار أزهار طقوش">
        </div>

        <h1 class="store-name-ar">أزهار طقوش 🌸</h1>
        <div class="store-name-en">Takkosh Flower Bristol</div>
        <p class="store-bio">أجمل باقات الورد وتنسيقات الهدايا لجميع مناسباتكم السعيدة. خدمة توصيل سريعة وعناية فائقة.</p>

        <div class="action-buttons">
            <a href="https://wa.me/96170625359?text=مرحباً،%20أود%20الاستفسار%20عن%20باقات%20الورد%20المتوفرة" target="_blank" class="whatsapp-btn">
                <i class="fa-brands fa-whatsapp fa-xl"></i>
                تواصل معنا عبر واتساب
            </a>
        </div>

        <div class="social-links">
            <a href="https://www.instagram.com/flowers.takkoush?igsi=MWNuZTF5ZTVnZ2ozdA==" target="_blank" class="social-icon instagram" title="إنستغرام">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://www.tiktok.com/@takkoush.bristol?_r=1&_t=ZS-99LijOKpa6f" target="_blank" class="social-icon tiktok" title="تيك توك">
                <i class="fa-brands fa-tiktok"></i>
            </a>
            <a href="https://www.facebook.com/share/1C7TgWeXVU/" target="_blank" class="social-icon facebook" title="فيسبوك">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
        </div>

        <div class="section-title">
            <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--primary-color);"></i>
            أحدث الباقات والمنتجات
        </div>
        
        <div class="products-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=300" alt="باقة توليب">
                <span class="product-tag">باقة توليب</span>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1582794543139-8ac9cb0f7b11?w=300" alt="ورد جوري">
                <span class="product-tag">ورد طبيعي</span>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1561181286-d3fee7d55364?w=300" alt="تنسيق هدايا">
                <span class="product-tag">تنسيق هدايا</span>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1508610048659-a06b669e3321?w=300" alt="أزهار مجففة">
                <span class="product-tag">أزهار مجففة</span>
            </div>
        </div>
    </div>

</body>
</html>
